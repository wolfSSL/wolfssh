name: Cppcheck Test

on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  run_cppcheck:
    name: Cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install cppcheck
        if: always()
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y cppcheck

      - name: Run CppCheck
        id: cpp_check_run
        if: always()
        run: >
          cppcheck
          -UWSCPFILEHDR -UXSNPRINTF
          -DLIBWOLFSSH_VERSION_STRING='""'
          --enable='warning,portability'
          --std=c99
          --force
          --check-level=exhaustive
          --error-exitcode=2
          --library=std.cfg
          --inline-suppr
          -j4
          -q
          .
          3>&1 1>&2 2>&3 | tee cppcheck.txt

      - name: Upload cppcheck results as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wolfssh-${{ github.sha }}-cppcheck_results.txt
          path: cppcheck.txt
